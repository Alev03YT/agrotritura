<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#173f2a"><title>AgroTritura Control Center</title><style>:root{--g:#173f2a;--g2:#245d40;--bg:#f3f6f3;--line:#dfe7e1;--txt:#18221c;--muted:#66736b;--shadow:0 18px 55px rgba(23,63,42,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top right,rgba(130,180,100,.25),transparent 36%),linear-gradient(145deg,#edf4ee,#fbfcfb)}.login-card{width:min(450px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--g);color:#fff;font-size:26px}.brand h1{margin:0;color:var(--g);font-size:1.3rem}.brand small{color:var(--muted)}label{display:block;font-weight:850;color:var(--g);margin:24px 0 8px}.input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;outline:0}.input:focus{border-color:var(--g2);box-shadow:0 0 0 4px rgba(36,93,64,.12)}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:#fff}.block{width:100%;margin-top:14px}.error{color:#b42318;font-weight:750;margin-top:12px}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:270px;background:var(--g);color:#fff;padding:20px 15px;display:flex;flex-direction:column;z-index:30}.side .brand h1{color:#fff}.side .brand small{color:rgba(255,255,255,.68)}.nav{display:grid;gap:7px;margin-top:24px}.nav button{border:0;background:transparent;color:rgba(255,255,255,.75);padding:12px 13px;border-radius:13px;text-align:left;font-weight:800;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.14);color:#fff}.side-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.16);padding-top:14px}.side-bottom button{width:100%;background:rgba(255,255,255,.1);color:#fff}.main{margin-left:270px;min-height:100vh}.top{height:70px;position:sticky;top:0;z-index:20;background:rgba(243,246,243,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top h2{margin:0;color:var(--g)}.pill{background:#e8f2ea;color:var(--g);border-radius:999px;padding:7px 11px;font-weight:850;font-size:.82rem}.content{padding:22px}.dashboard{max-width:1200px;margin:auto}.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:24px;padding:26px;box-shadow:var(--shadow)}.hero h2{font-size:clamp(1.7rem,4vw,2.5rem);margin:0}.hero p{opacity:.82}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 25px rgba(23,63,42,.06);cursor:pointer}.card:hover{transform:translateY(-2px)}.card .ico{font-size:28px}.card h3{color:var(--g);margin:10px 0 5px}.card p{margin:0;color:var(--muted);font-size:.9rem}.workspace{height:calc(100vh - 70px);background:#fff}.workspace iframe{width:100%;height:100%;border:0;background:#fff}.menu{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0}.menu{display:inline-flex;border:0;background:#fff;border-radius:11px;padding:9px}.cards{grid-template-columns:1fr}.content{padding:14px}}</style></head><body><section id="login" class="login"><div class="login-card"><div class="brand"><div class="logo">🌾</div><div><h1>AgroTritura Control Center</h1><small>Un unico accesso per tutti gli strumenti</small></div></div><label for="password">Password di accesso</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Inserisci la password"><button id="loginBtn" class="btn primary block">Accedi</button><div id="error" class="error hidden">Password non corretta.</div></div></section><div id="app" class="app hidden"><aside id="side" class="side"><div class="brand"><div class="logo">🌾</div><div><h1>AgroTritura</h1><small>Control Center</small></div></div><nav id="nav" class="nav"></nav><div class="side-bottom"><button id="logout" class="btn">Esci</button></div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button id="menu" class="menu">☰</button><h2 id="title">Dashboard</h2></div><span id="rolePill" class="pill"></span></header><section id="dashboard" class="content"><div class="dashboard"><div class="hero"><h2>Benvenuto nel pannello AgroTritura</h2><p>Ordini, preventivi, prezzi e produzione riuniti in un’unica area privata.</p></div><div id="cards" class="cards"></div></div></section><section id="workspace" class="workspace hidden"><iframe id="frame" title="Strumento AgroTritura"></iframe></section></main></div><script>const ACCESS={'12fc7a46b202d174221b066c89dbc1a3229c1d49b59ef899b0a85bd5feed576c':{role:'Super Admin',tools:['dashboard','ordini','smart','preventivi','prezzi','produzione']},'77a53608f85a2cbba12f719bbca19b491abb03133c49bff7277ee6dfcfd7fc49':{role:'Ordini',tools:['dashboard','ordini']},'129585e53266e1041a78d65be4b14e2c9849a2ef3ecd4b623827fe2629726e05':{role:'Prezzi',tools:['dashboard','prezzi']},'11c2895ba5ba1eb51267fa842fb22d2d299e07a849955363d9e3d191b2be13a6':{role:'Preventivi',tools:['dashboard','smart','preventivi']},'0488aad4120d47a1cb6208f7ab57167b6cf394b663bb204d39b3b6603d66fe15':{role:'Produzione',tools:['dashboard','produzione']}};const TOOLS={dashboard:{label:'Dashboard',icon:'▦',desc:'Panoramica generale'},ordini:{label:'Ordini',icon:'📦',desc:'Crea e aggiorna gli ordini',url:'admin-ordini.html'},smart:{label:'Preventivi Smart',icon:'💶',desc:'Incolla una richiesta WhatsApp e calcola la proposta',url:'preventivi-smart.html'},preventivi:{label:'Preventivi',icon:'📄',desc:'Crea, salva, stampa e invia preventivi',url:'preventivi-admin.html'},prezzi:{label:'Monitor prezzi',icon:'📈',desc:'Controlla i prezzi dei cereali',url:'monitor-prezzi.html'},produzione:{label:'Formulatore mix',icon:'🧠',desc:'Calcola ricette e schede di produzione',url:'produzione.html'}};let session=null;const $=s=>document.querySelector(s);async function sha(t){const d=new TextEncoder().encode(t),h=await crypto.subtle.digest('SHA-256',d);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}async function login(){const a=ACCESS[await sha($('#password').value)];if(!a){$('#error').classList.remove('hidden');return}session=a;sessionStorage.setItem('at_cc_session',JSON.stringify(a));start()}function start(){if(!session)return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#rolePill').textContent=session.role;renderNav();show('dashboard')}function renderNav(){$('#nav').innerHTML=session.tools.map(k=>`<button data-tool="${k}">${TOOLS[k].icon} ${TOOLS[k].label}</button>`).join('');$('#cards').innerHTML=session.tools.filter(k=>k!=='dashboard').map(k=>`<article class="card" data-card="${k}"><div class="ico">${TOOLS[k].icon}</div><h3>${TOOLS[k].label}</h3><p>${TOOLS[k].desc}</p></article>`).join('');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>show(b.dataset.tool));document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>show(b.dataset.card))}function show(k){if(!session.tools.includes(k))return;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===k));$('#title').textContent=TOOLS[k].label;$('#side').classList.remove('open');if(k==='dashboard'){$('#dashboard').classList.remove('hidden');$('#workspace').classList.add('hidden');return}$('#dashboard').classList.add('hidden');$('#workspace').classList.remove('hidden');const f=$('#frame');f.onload=()=>unlockChild(k,f);f.src=TOOLS[k].url}function unlockChild(k,f){try{const d=f.contentDocument,w=f.contentWindow;if(k==='ordini'){const gate=d.getElementById('gate');if(gate)gate.style.display='none';const pill=d.getElementById('sessPill');if(pill)pill.textContent='🔓 Accesso da Control Center'}if(k==='prezzi'){const l=d.getElementById('loginView'),v=d.getElementById('dashboardView');if(l)l.classList.add('hidden');if(v)v.classList.remove('hidden');if(w.loadPrices)w.loadPrices();const out=d.getElementById('logoutBtn');if(out)out.style.display='none'}}catch(e){console.warn('Integrazione strumento:',e)}}$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#logout').onclick=()=>{sessionStorage.removeItem('at_cc_session');location.reload()};$('#menu').onclick=()=>$('#side').classList.toggle('open');try{session=JSON.parse(sessionStorage.getItem('at_cc_session'));if(session)start()}catch{}</script></body></html>
