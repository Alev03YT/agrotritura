<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AgroTritura • Preventivi</title><style>:root{--g:#173f2a;--g2:#2f7a50;--bg:#f4f7f4;--line:#dfe7e1;--muted:#68736c;--gold:#dcae4b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#18221c}button,input,select,textarea{font:inherit}.wrap{max-width:1200px;margin:auto;padding:20px}.head h1{margin:0;color:var(--g)}.head p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr .9fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(23,63,42,.06)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:850;color:var(--g);margin:2px 0 7px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;outline:0;background:#fff}textarea{min-height:100px;resize:vertical}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:#fff}.light{background:#eaf3ec;color:var(--g)}.gold{background:var(--gold);color:#18221c}.quote h2{color:var(--g);margin:0 0 12px}.line{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--line)}.total{font-size:1.55rem;font-weight:900;color:var(--g)}.box{margin-top:14px;padding:14px;border-radius:15px;background:#f5f8f5;white-space:pre-wrap;line-height:1.5}.history{margin-top:18px}.row{display:grid;grid-template-columns:110px 1fr 100px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:850px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:1fr 1fr}}@media print{.no-print,.head,.history{display:none!important}.wrap{padding:0}.card{border:0;box-shadow:none}}</style></head><body><main class="wrap"><div class="head"><h1>Generatore preventivi</h1><p>Crea, stampa, copia e salva preventivi senza uscire dal Control Center.</p></div><div class="grid"><section class="card no-print"><div class="fields"><div><label>Cliente</label><input id="cliente" placeholder="Nome e cognome"></div><div><label>Telefono</label><input id="telefono" placeholder="Numero WhatsApp"></div><div><label>Prodotto</label><select id="prodotto"><option>Mais tritato</option><option>Orzo tritato</option><option>Frumento tritato</option><option>Grana verde</option><option>Mix personalizzato</option></select></div><div><label>Granulometria</label><select id="gran"><option>Media</option><option>Grossa</option><option>Fine</option></select></div><div><label>Quantità (kg)</label><input id="kg" type="number" min="1" step="1" value="100"></div><div><label>Prezzo al kg (€)</label><input id="prezzo" type="number" min="0" step="0.01" value="0.65"></div><div><label>Trasporto (€)</label><input id="trasporto" type="number" min="0" step="0.01" value="0"></div><div><label>Sconto (€)</label><input id="sconto" type="number" min="0" step="0.01" value="0"></div><div class="full"><label>Consegna / ritiro</label><input id="consegna" placeholder="Es. consegna a Novara oppure ritiro in sede"></div><div class="full"><label>Note</label><textarea id="note" placeholder="Disponibilità, tempi, composizione, condizioni..."></textarea></div></div><div class="btns"><button id="genera" class="btn primary">Aggiorna preventivo</button><button id="salva" class="btn light">Salva</button><button id="stampa" class="btn light">Stampa / PDF</button><button id="copia" class="btn gold">Copia messaggio</button><button id="wa" class="btn primary">Apri WhatsApp</button></div></section><section class="card quote"><h2>Preventivo AgroTritura</h2><div class="line"><span>Cliente</span><b id="qCliente">—</b></div><div class="line"><span>Prodotto</span><b id="qProdotto">—</b></div><div class="line"><span>Quantità</span><b id="qKg">—</b></div><div class="line"><span>Prezzo prodotto</span><b id="qMerce">—</b></div><div class="line"><span>Trasporto</span><b id="qTrasporto">—</b></div><div class="line"><span>Sconto</span><b id="qSconto">—</b></div><div class="line"><span>Totale</span><b id="qTotale" class="total">—</b></div><div id="testo" class="box"></div></section></div><section class="card history no-print"><h2 style="color:var(--g);margin-top:0">Storico preventivi</h2><div id="history"></div></section></main><script>const $=s=>document.querySelector(s),euro=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});let current={};function build(){const kg=+$('#kg').value||0,prezzo=+$('#prezzo').value||0,trasporto=+$('#trasporto').value||0,sconto=+$('#sconto').value||0,merce=kg*prezzo,tot=Math.max(0,merce+trasporto-sconto);current={cliente:$('#cliente').value.trim()||'Cliente',telefono:$('#telefono').value.trim(),prodotto:$('#prodotto').value,gran:$('#gran').value,kg,prezzo,trasporto,sconto,merce,tot,consegna:$('#consegna').value.trim(),note:$('#note').value.trim()};$('#qCliente').textContent=current.cliente;$('#qProdotto').textContent=current.prodotto+' • '+current.gran;$('#qKg').textContent=kg.toLocaleString('it-IT')+' kg';$('#qMerce').textContent=euro(merce);$('#qTrasporto').textContent=euro(trasporto);$('#qSconto').textContent='− '+euro(sconto);$('#qTotale').textContent=euro(tot);$('#testo').textContent=message();}function message(){return `Ciao ${current.cliente},\n\necco il preventivo AgroTritura:\n\nProdotto: ${current.prodotto}\nGranulometria: ${current.gran}\nQuantità: ${current.kg} kg\nPrezzo al kg: ${euro(current.prezzo)}\nMerce: ${euro(current.merce)}\nTrasporto: ${euro(current.trasporto)}\nSconto: ${euro(current.sconto)}\nTotale: ${euro(current.tot)}${current.consegna?'\nConsegna/Ritiro: '+current.consegna:''}${current.note?'\nNote: '+current.note:''}\n\nPreventivo indicativo soggetto a conferma di disponibilità.`}function load(){const a=JSON.parse(localStorage.getItem('at_quotes')||'[]');$('#history').innerHTML=a.length?a.map(x=>`<div class="row"><div>${new Date(x.date).toLocaleDateString('it-IT')}</div><div><b>${x.cliente}</b><br><small>${x.prodotto}</small></div><div>${euro(x.tot)}</div><button class="btn light" onclick="delQ('${x.id}')">Elimina</button></div>`).join(''):'Nessun preventivo salvato.'}$('#genera').onclick=build;document.querySelectorAll('input,select,textarea').forEach(x=>x.addEventListener('input',build));$('#stampa').onclick=()=>print();$('#copia').onclick=async()=>{build();await navigator.clipboard.writeText(message())};$('#wa').onclick=()=>{build();const n=current.telefono.replace(/\D/g,'');window.open(`https://wa.me/${n}?text=${encodeURIComponent(message())}`,'_blank')};$('#salva').onclick=()=>{build();const a=JSON.parse(localStorage.getItem('at_quotes')||'[]');a.unshift({...current,id:String(Date.now()),date:new Date().toISOString()});localStorage.setItem('at_quotes',JSON.stringify(a));load()};window.delQ=id=>{const a=JSON.parse(localStorage.getItem('at_quotes')||'[]').filter(x=>x.id!==id);localStorage.setItem('at_quotes',JSON.stringify(a));load()};build();load();</script></body></html>
