<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AgroTritura • Preventivi Smart</title><style>:root{--g:#173f2a;--bg:#f3f6f3;--line:#dfe7e1;--muted:#66736b;--red:#a43e35}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#18221c}button,input,select,textarea{font:inherit}.wrap{max-width:1250px;margin:auto;padding:20px}.head h1{margin:0;color:var(--g)}.head p{color:var(--muted)}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(23,63,42,.06)}label{display:block;font-weight:800;color:var(--g);margin-bottom:11px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:6px}textarea{min-height:250px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--g);color:#fff}.light{background:#eaf3ec;color:var(--g)}.danger{background:#fff0ee;color:var(--red)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{background:#f4f8f5;border:1px solid var(--line);border-radius:14px;padding:12px}.stat span,.stat b{display:block}.stat span{font-size:.78rem;color:var(--muted)}.stat b{margin-top:5px;color:var(--g);font-size:1.05rem}.result{background:#173f2a;color:#fff;border-radius:17px;padding:16px;margin-top:14px}.result h2{margin:0 0 10px}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.result-grid div{background:rgba(255,255,255,.1);padding:10px;border-radius:12px}.composition{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}.composition div{margin:5px 0}.error{color:var(--red);font-weight:750;margin-top:10px}.ok{color:#287348;font-weight:750;margin-top:10px}.hidden{display:none!important}.mode-note{background:#eef5f0;border:1px solid var(--line);border-radius:13px;padding:11px;color:var(--g);font-size:.88rem;margin:4px 0 12px}@media(max-width:850px){.grid,.fields{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:520px){.summary,.result-grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><div class="head"><h1>💶 Preventivi Smart</h1><p>Importa una formulazione già preparata oppure una richiesta cliente e calcola subito il preventivo.</p></div><div class="grid"><section class="card"><label>Richiesta / formulazione<textarea id="msg" placeholder="Incolla qui il messaggio..."></textarea></label><div class="btns"><button id="analyze" class="btn primary">Analizza</button><button id="clear" class="btn danger">Pulisci</button></div><div id="error" class="error hidden"></div><div id="ok" class="ok hidden"></div></section><section class="card"><div class="fields"><label>Nome cliente<input id="name"></label><label>Telefono<input id="phone"></label><label>Indirizzo<input id="address"></label><label>Prodotto<select id="product"><option>Mais</option><option>Orzo</option><option>Frumento</option><option>Grana verde</option><option>Mix personalizzato</option></select></label><label>Modalità di calcolo<select id="mode"><option value="quantity">Quantità già definita</option><option value="budget">Calcola dal budget</option></select></label><label>Quantità (kg)<input id="kg" type="number" min="0" step="0.5"></label><label>Budget massimo (€)<input id="budget" type="number" min="0" step="1"></label><label>Budget comprende<select id="budgetType"><option value="totale">Prodotti e consegna</option><option value="prodotti">Solo prodotti</option></select></label><label>Trasporto (€)<input id="transport" type="number" min="0" step="0.01"></label></div><div id="modeNote" class="mode-note"></div><div class="btns"><button id="calculate" class="btn primary">Calcola preventivo</button><button id="copy" class="btn light">Copia risposta</button><a id="wa" class="btn light" target="_blank" rel="noopener">Apri WhatsApp</a></div><div class="summary"><div class="stat"><span>Prezzo base/kg</span><b id="basePrice">—</b></div><div class="stat"><span>Sconto</span><b id="discount">—</b></div><div class="stat"><span>Prezzo effettivo/kg</span><b id="unitPrice">—</b></div><div class="stat"><span>Quantità</span><b id="quantity">—</b></div></div><div id="result" class="result hidden"><h2>Preventivo consigliato</h2><div class="result-grid"><div>Prodotti<br><b id="goodsTotal"></b></div><div>Risparmio quantità<br><b id="saving"></b></div><div>Trasporto<br><b id="transportTotal"></b></div><div>Totale<br><b id="grandTotal"></b></div></div><div id="composition" class="composition"></div></div></section></div></main><script>(()=>{'use strict';const BASE={Mais:.75,Orzo:.76,Frumento:.78,'Grana verde':.80,'Mix personalizzato':.84};const $=s=>document.querySelector(s);const num=v=>parseFloat(String(v??'').replace(',','.'))||0;const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');let importedComposition=[];let formulationName='';function tier(q){return q>=500?6:q>=250?4:q>=100?2:0}function unit(product,q){return BASE[product]*(1-tier(q)/100)}function ok(t){$('#ok').textContent=t;$('#ok').classList.remove('hidden');$('#error').classList.add('hidden')}function err(t){$('#error').textContent=t;$('#error').classList.remove('hidden');$('#ok').classList.add('hidden')}function pick(t,l){return(t.match(new RegExp('(?:^|\\n)\\s*(?:[-•]\\s*)?'+esc(l)+'\\s*:\\s*(.+)','i'))||[])[1]?.trim()||''}function parseComposition(t){const block=(t.match(/🧩\s*Composizione\s*\n([\s\S]*?)(?:\n\s*💶|\n\s*📝|$)/i)||[])[1]||'';return block.split('\n').map(line=>{const m=line.match(/[-•]\s*(.+?):\s*(\d+(?:[,.]\d+)?)%\s*\((\d+(?:[,.]\d+)?)\s*kg\)/i);return m?{name:m[1].trim(),pct:num(m[2]),kg:num(m[3])}:null}).filter(Boolean)}function syncMode(){const q=$('#mode').value==='quantity';$('#kg').closest('label').classList.toggle('hidden',!q);$('#budget').closest('label').classList.toggle('hidden',q);$('#budgetType').closest('label').classList.toggle('hidden',q);$('#modeNote').textContent=q?'La formulazione ha già una quantità precisa: inserisci soltanto cliente, trasporto e calcola.':'Il sistema calcola quanti kg rientrano nel budget indicato.'}function parse(){const t=$('#msg').value.trim();if(!t)throw Error('Nessun messaggio da analizzare.');$('#name').value=pick(t,'Nome');$('#phone').value=pick(t,'Telefono');$('#address').value=pick(t,'Comune/Indirizzo');const p=pick(t,'Prodotto');if(p&&BASE[p])$('#product').value=p;formulationName=pick(t,'Nome formulazione');importedComposition=parseComposition(t);const quantity=num(pick(t,'Quantità'));const budget=num(pick(t,'Budget massimo'));const transport=num(pick(t,'Trasporto stimato A/R'));$('#kg').value=quantity||'';$('#budget').value=budget||'';$('#transport').value=transport||'';$('#budgetType').value=pick(t,'Il budget comprende').toLowerCase().includes('solo')?'prodotti':'totale';$('#mode').value=quantity?'quantity':'budget';syncMode();ok(quantity?'Formulazione importata: completa i dati del cliente e il trasporto, poi calcola.':'Richiesta importata: completa i dati mancanti e calcola.')}function calculate(){const product=$('#product').value,transport=num($('#transport').value);let kg=0;if($('#mode').value==='quantity'){kg=num($('#kg').value);if(!kg)throw Error('Inserisci la quantità della formulazione.')}else{const budget=num($('#budget').value);if(!budget)throw Error('Inserisci il budget massimo.');const available=$('#budgetType').value==='totale'?budget-transport:budget;if(available<=0)throw Error('Il trasporto assorbe tutto il budget.');kg=Math.floor(available/BASE[product]);kg=Math.floor(available/unit(product,kg))}const base=BASE[product],effective=unit(product,kg),discount=tier(kg),goods=kg*effective,saving=kg*base-goods,total=goods+transport;$('#basePrice').textContent=base.toFixed(2).replace('.',',')+' €/kg';$('#discount').textContent=discount?discount+'%':'Nessuno';$('#unitPrice').textContent=effective.toFixed(3).replace('.',',')+' €/kg';$('#quantity').textContent=kg.toLocaleString('it-IT')+' kg';$('#goodsTotal').textContent=money(goods);$('#saving').textContent=saving>0?'-'+money(saving):money(0);$('#transportTotal').textContent=money(transport);$('#grandTotal').textContent=money(total);$('#composition').innerHTML=importedComposition.length?'<h3>Composizione formulata</h3>'+importedComposition.map(x=>`<div>${x.name}: <b>${x.kg.toLocaleString('it-IT',{maximumFractionDigits:2})} kg</b> (${x.pct}%)</div>`).join(''):'';$('#result').classList.remove('hidden');const who=$('#name').value.trim();const reply=[`Buongiorno${who?' '+who:''},`, '', `come richiesto ho preparato il preventivo per ${kg.toLocaleString('it-IT')} kg di ${formulationName||product}.`, `Prezzo base: ${base.toFixed(2).replace('.',',')} €/kg`, `Sconto quantità: ${discount}%`, `Totale prodotti: ${money(goods)}`, `Trasporto: ${money(transport)}`, `Totale preventivo: ${money(total)}`, '', 'Composizione:', ...importedComposition.map(x=>`- ${x.name}: ${x.kg.toLocaleString('it-IT',{maximumFractionDigits:2})} kg (${x.pct}%)`), '', 'Il preventivo è da confermare prima della preparazione.'].join('\n');$('#copy').dataset.text=reply;let phone=$('#phone').value.replace(/\D/g,'');if(phone&&!phone.startsWith('39'))phone='39'+phone;$('#wa').href=phone?'https://wa.me/'+phone+'?text='+encodeURIComponent(reply):'#';ok('Preventivo calcolato correttamente.')}$('#analyze').onclick=()=>{try{parse()}catch(e){err(e.message)}};$('#calculate').onclick=()=>{try{calculate()}catch(e){err(e.message)}};$('#clear').onclick=()=>location.reload();$('#mode').onchange=syncMode;$('#copy').onclick=async()=>{const t=$('#copy').dataset.text||'';if(!t)return err('Calcola prima il preventivo.');try{await navigator.clipboard.writeText(t);ok('Risposta copiata.')}catch{prompt('Copia:',t)}};syncMode();const imported=localStorage.getItem('at_quote_import');if(imported){$('#msg').value=imported;localStorage.removeItem('at_quote_import');setTimeout(()=>{try{parse()}catch(e){err(e.message)}},50)}})();</script></body></html>
