<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AgroTritura • Preventivi Smart</title>
  <style>
    :root{--g:#173f2a;--g2:#2f7a50;--bg:#f3f6f3;--line:#dfe7e1;--muted:#66736b;--red:#a43e35}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#18221c}
    button,input,select,textarea{font:inherit}.wrap{max-width:1250px;margin:auto;padding:20px}.head h1{margin:0;color:var(--g)}.head p{color:var(--muted)}
    .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(23,63,42,.06)}
    label{display:block;font-weight:800;color:var(--g);margin-bottom:11px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:6px}textarea{min-height:260px;resize:vertical}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#fff}.light{background:#eaf3ec;color:var(--g)}.danger{background:#fff0ee;color:var(--red)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{background:#f4f8f5;border:1px solid var(--line);border-radius:14px;padding:12px}.stat span,.stat b{display:block}.stat span{font-size:.78rem;color:var(--muted)}.stat b{margin-top:5px;color:var(--g);font-size:1.15rem}
    .mix{margin-top:14px}.mix-row{display:grid;grid-template-columns:1fr 90px 95px;gap:8px;align-items:center;margin-bottom:8px}.mix-row input{margin:0}.result{background:#173f2a;color:#fff;border-radius:17px;padding:16px;margin-top:14px}.result h2{margin:0 0 10px}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.result-grid div{background:rgba(255,255,255,.1);padding:10px;border-radius:12px}.error{color:var(--red);font-weight:750;margin-top:10px}.ok{color:#287348;font-weight:750;margin-top:10px}.hidden{display:none!important}
    @media(max-width:850px){.grid,.fields{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.mix-row{grid-template-columns:1fr 78px 82px}}@media(max-width:520px){.summary,.result-grid{grid-template-columns:1fr}.wrap{padding:12px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="head"><h1>💶 Preventivi Smart</h1><p>Incolla la richiesta WhatsApp, verifica i dati e calcola automaticamente la proposta.</p></div>
  <div class="grid">
    <section class="card">
      <label>Richiesta WhatsApp<textarea id="msg" placeholder="Incolla qui il messaggio ricevuto..."></textarea></label>
      <div class="btns"><button id="analyze" class="btn primary" type="button">Analizza richiesta</button><button id="example" class="btn light" type="button">Carica esempio</button><button id="clear" class="btn danger" type="button">Pulisci</button></div>
      <div id="error" class="error hidden"></div><div id="ok" class="ok hidden"></div>
    </section>
    <section class="card">
      <div class="fields">
        <label>Nome<input id="name"></label><label>Telefono<input id="phone"></label>
        <label>Indirizzo<input id="address"></label>
        <label>Prodotto<select id="product"><option>Mais</option><option>Orzo</option><option>Frumento</option><option>Grana verde</option><option>Mix personalizzato</option><option>Altro / da definire</option></select></label>
        <label>Quantità minima (kg)<input id="minKg" type="number" min="0" step="1"></label>
        <label>Budget massimo (€)<input id="budget" type="number" min="0" step="1"></label>
        <label>Budget comprende<select id="budgetType"><option value="totale">Prodotti e consegna</option><option value="prodotti">Solo prodotti</option></select></label>
        <label>Trasporto (€)<input id="transport" type="number" min="0" step="0.01"></label>
      </div>
      <div id="mixBox" class="mix hidden"><b>Composizione mix</b><div id="mixRows"></div><small>Le percentuali devono totalizzare 100%.</small></div>
      <div class="btns"><button id="calculate" class="btn primary" type="button">Calcola proposta</button><button id="copy" class="btn light" type="button">Copia risposta</button><a id="wa" class="btn light" target="_blank" rel="noopener">Apri WhatsApp</a></div>
      <div class="summary"><div class="stat"><span>Budget prodotti</span><b id="goodsBudget">—</b></div><div class="stat"><span>Prezzo medio/kg</span><b id="avgPrice">—</b></div><div class="stat"><span>Quantità proposta</span><b id="suggestedKg">—</b></div></div>
      <div id="result" class="result hidden"><h2>Preventivo consigliato</h2><div class="result-grid"><div>Prodotti<br><b id="goodsTotal"></b></div><div>Trasporto<br><b id="transportTotal"></b></div><div>Totale<br><b id="grandTotal"></b></div><div>Esito quantità<br><b id="quantityCheck"></b></div></div><div id="composition"></div></div>
    </section>
  </div>
</main>
<script>
(() => {
  'use strict';
  const PRICES={Mais:{small:.69,big:.63},Orzo:{small:.69,big:.63},Frumento:{small:.71,big:.65},'Grana verde':{small:.72,big:.66},'Mix personalizzato':{small:.75,big:.69}};
  const $=s=>document.querySelector(s);
  const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);
  const num=v=>Number.parseFloat(String(v??'').replace(',','.'))||0;
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

  function showError(message){$('#error').textContent=message;$('#error').classList.remove('hidden');$('#ok').classList.add('hidden');}
  function showOk(message){$('#ok').textContent=message;$('#ok').classList.remove('hidden');$('#error').classList.add('hidden');}
  function pick(text,label){
    const re=new RegExp('(?:^|\\n)\\s*(?:[-•]\\s*)?'+esc(label)+'\\s*:\\s*(.+)','i');
    const m=text.match(re); return m&&m[1]?m[1].trim():'';
  }
  function setProduct(value){
    const opts=[...$('#product').options];
    const found=opts.find(o=>o.value.toLowerCase()===value.toLowerCase());
    if(found) $('#product').value=found.value;
  }
  function notesFrom(text){const m=text.match(/📝\s*Note\s*\n([\s\S]*?)(?:\n\s*🔁|$)/i);return m&&m[1]?m[1].trim():'';}

  function setupMix(notes=''){
    const show=$('#product').value==='Mix personalizzato';
    $('#mixBox').classList.toggle('hidden',!show);
    if(!show)return;
    const names=['Mais','Orzo','Frumento','Grana verde'];
    const selected=names.filter(n=>notes.toLowerCase().includes(n.toLowerCase()));
    const active=selected.length?selected:names;
    const base=Math.floor(100/active.length); let remainder=100-base*active.length;
    $('#mixRows').innerHTML=names.map(n=>{
      const enabled=active.includes(n); const pct=enabled?base+(remainder-- > 0?1:0):0;
      return `<div class="mix-row"><label style="margin:0"><input class="mix-on" type="checkbox" data-name="${n}" ${enabled?'checked':''} style="width:auto;margin-right:6px">${n}</label><input class="mix-pct" data-name="${n}" type="number" min="0" max="100" value="${pct}"><span>${PRICES[n].small.toFixed(2).replace('.',',')} €/kg</span></div>`;
    }).join('');
  }

  function parseRequest(){
    const text=$('#msg').value.trim();
    if(!text) throw new Error('Incolla prima il messaggio WhatsApp.');
    $('#name').value=pick(text,'Nome');
    $('#phone').value=pick(text,'Telefono');
    $('#address').value=pick(text,'Comune/Indirizzo');
    const product=pick(text,'Prodotto'); if(product) setProduct(product);
    $('#minKg').value=num(pick(text,'Quantità'))||'';
    $('#budget').value=num(pick(text,'Budget massimo'))||'';
    $('#transport').value=num(pick(text,'Trasporto stimato A/R'))||'';
    const bt=pick(text,'Il budget comprende').toLowerCase();
    $('#budgetType').value=bt.includes('solo')?'prodotti':'totale';
    setupMix(notesFrom(text));
    showOk('Richiesta analizzata. Controlla i campi e premi “Calcola proposta”.');
  }

  function priceFor(name,kg){const p=PRICES[name];return p?(kg>=100?p.big:p.small):0;}
  function calculate(){
    const product=$('#product').value,budget=num($('#budget').value),transport=num($('#transport').value),type=$('#budgetType').value,minKg=num($('#minKg').value);
    if(!budget) throw new Error('Inserisci il budget massimo.');
    const goodsBudget=Math.max(0,type==='totale'?budget-transport:budget);
    if(goodsBudget<=0) throw new Error('Il trasporto assorbe tutto il budget disponibile.');
    let avg=0,kg=0,composition=[];
    if(product==='Mix personalizzato'){
      const rows=[...document.querySelectorAll('.mix-on:checked')].map(c=>({name:c.dataset.name,pct:num(document.querySelector(`.mix-pct[data-name="${c.dataset.name}"]`).value)}));
      const totalPct=rows.reduce((s,r)=>s+r.pct,0);
      if(!rows.length) throw new Error('Seleziona almeno un ingrediente.');
      if(Math.abs(totalPct-100)>.01) throw new Error('Le percentuali del mix devono totalizzare 100%.');
      avg=rows.reduce((s,r)=>s+priceFor(r.name,100)*r.pct/100,0);
      kg=Math.floor(goodsBudget/avg);
      avg=rows.reduce((s,r)=>s+priceFor(r.name,kg)*r.pct/100,0);
      kg=Math.floor(goodsBudget/avg);
      composition=rows.map(r=>({...r,kg:kg*r.pct/100}));
    }else{
      if(!PRICES[product]) throw new Error('Per “Altro / da definire” devi prima scegliere un prodotto con prezzo noto.');
      avg=priceFor(product,1); kg=Math.floor(goodsBudget/avg); avg=priceFor(product,kg); kg=Math.floor(goodsBudget/avg);
    }
    render(goodsBudget,avg,kg,transport,minKg,composition);
  }

  function render(goodsBudget,avg,kg,transport,minKg,composition){
    const goods=kg*avg,total=goods+transport;
    $('#goodsBudget').textContent=money(goodsBudget); $('#avgPrice').textContent=avg.toFixed(2).replace('.',',')+' €/kg'; $('#suggestedKg').textContent=kg+' kg';
    $('#goodsTotal').textContent=money(goods); $('#transportTotal').textContent=money(transport); $('#grandTotal').textContent=money(total);
    $('#quantityCheck').textContent=!minKg?'Quantità calcolata':kg>=minKg?'Rientra nel minimo richiesto':'Non raggiunge il minimo';
    $('#composition').innerHTML=composition.length?'<h3>Composizione</h3>'+composition.map(r=>`<div>${r.name}: <b>${r.kg.toFixed(1).replace('.',',')} kg</b> (${r.pct}%)</div>`).join(''):'';
    $('#result').classList.remove('hidden');
    const reply=`Buongiorno ${$('#name').value||''}, con il budget indicato posso proporre circa ${kg} kg di ${$('#product').value}. Prodotti: ${money(goods)}. Trasporto: ${money(transport)}. Totale: ${money(total)}.${minKg&&kg<minKg?' La quantità minima richiesta non rientra nel budget.':''}`;
    $('#copy').dataset.text=reply;
    let phone=($('#phone').value||'').replace(/\D/g,''); if(phone.startsWith('0')) phone='39'+phone; else if(!phone.startsWith('39')) phone='39'+phone;
    $('#wa').href='https://wa.me/'+phone+'?text='+encodeURIComponent(reply);
    showOk('Preventivo calcolato correttamente.');
  }

  $('#analyze').addEventListener('click',()=>{try{parseRequest()}catch(e){showError(e.message)}});
  $('#calculate').addEventListener('click',()=>{try{calculate()}catch(e){showError(e.message)}});
  $('#clear').addEventListener('click',()=>location.reload());
  $('#example').addEventListener('click',()=>{$('#msg').value='📄 DATI PER PREVENTIVO — AgroTritura\n\n👤 Cliente\n- Nome: Alessandro Valerio\n- Telefono: 3341067510\n- Comune/Indirizzo: Via Giovan Battista Gambaro 10b Galliate\n\n📦 Richiesta\n- Prodotto: Mix personalizzato\n- Quantità: 100 kg minimi desiderati\n- Modalità: A domicilio\n\n💶 Budget disponibile\n- Budget massimo: 150 €\n- Il budget comprende: prodotti e consegna\n\n🚚 Trasporto / Distanza\n- Trasporto stimato A/R: 45,00 €\n\n📝 Note\nOrzo, Frumento, Mais, Grana Verde';showOk('Esempio caricato. Premi “Analizza richiesta”.');});
  $('#copy').addEventListener('click',async()=>{const t=$('#copy').dataset.text||'';if(!t){showError('Calcola prima il preventivo.');return;}try{await navigator.clipboard.writeText(t);showOk('Risposta copiata.')}catch{window.prompt('Copia:',t)}});
  $('#product').addEventListener('change',()=>setupMix(''));
})();
</script>
</body>
</html>
