<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AgroTritura • Preventivi Smart</title>
<style>:root{--g:#173f2a;--bg:#f3f6f3;--line:#dfe7e1;--muted:#66736b;--red:#a43e35}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#18221c}button,input,textarea{font:inherit}.wrap{max-width:1200px;margin:auto;padding:20px}.head h1{margin:0;color:var(--g)}.head p{color:var(--muted)}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(23,63,42,.06)}label{display:block;font-weight:800;color:var(--g);margin-bottom:11px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:6px}textarea{min-height:310px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#fff}.light{background:#eaf3ec;color:var(--g)}.danger{background:#fff0ee;color:var(--red)}.hidden{display:none!important}.error{color:var(--red);font-weight:750}.ok{color:#287348;font-weight:750}.result{background:#173f2a;color:#fff;border-radius:17px;padding:16px;margin-top:14px}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.result-grid div{background:rgba(255,255,255,.1);padding:10px;border-radius:12px}.ingredients{margin-top:14px}.ingredients div{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}@media(max-width:850px){.grid,.fields{grid-template-columns:1fr}.result-grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head>
<body><main class="wrap"><div class="head"><h1>💶 Preventivi Smart</h1><p>Importa una formulazione, completa i dati del cliente e genera subito il preventivo finale.</p></div><div class="grid">
<section class="card"><label>Messaggio preventivo<textarea id="msg" placeholder="Incolla qui il messaggio generato dal Formulatore Mix..."></textarea></label><div class="btns"><button id="analyze" class="btn primary">Analizza e calcola</button><button id="clear" class="btn danger">Pulisci</button></div><div id="error" class="error hidden"></div><div id="ok" class="ok hidden"></div></section>
<section class="card"><div class="fields"><label>Nome cliente<input id="name"></label><label>Telefono<input id="phone"></label><label>Indirizzo<input id="address"></label><label>Trasporto (€)<input id="transport" type="number" min="0" step="0.01" value="0"></label><label>Sconto manuale (%)<input id="manualDiscount" type="number" min="0" max="100" step="0.1" value="0"></label><label>Validità preventivo (giorni)<input id="validDays" type="number" min="1" step="1" value="15"></label></div><div class="btns"><button id="calculate" class="btn primary">Ricalcola preventivo</button><button id="copy" class="btn light">Copia messaggio</button><a id="wa" class="btn light" target="_blank" rel="noopener">Apri WhatsApp</a></div><div id="ingredientList" class="ingredients"></div><div id="result" class="result hidden"><h2 id="mixName">Preventivo</h2><div class="result-grid"><div>Totale prodotti<br><b id="productsTotal"></b></div><div>Sconto<br><b id="discountTotal"></b></div><div>Trasporto<br><b id="transportTotal"></b></div><div>Totale finale<br><b id="grandTotal"></b></div></div></div></section>
</div></main>
<script>(()=>{'use strict';const $=s=>document.querySelector(s);const num=v=>parseFloat(String(v??'').replace(',','.'))||0;const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);let data=null;function ok(t){$('#ok').textContent=t;$('#ok').classList.remove('hidden');$('#error').classList.add('hidden')}function err(t){$('#error').textContent=t;$('#error').classList.remove('hidden');$('#ok').classList.add('hidden')}function pick(t,l){const esc=l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return(t.match(new RegExp('(?:^|\\n)\\s*(?:[-•]\\s*)?'+esc+'\\s*:\\s*(.*)','i'))||[])[1]?.trim()||''}
function parseIngredients(t){const block=(t.match(/🧩\s*Ingredienti\s*\n([\s\S]*?)(?:\n\s*💰|\n\s*🚚|$)/i)||[])[1]||'';return block.split('\n').map(line=>{const m=line.match(/[-•]\s*(.+?):\s*(\d+(?:[,.]\d+)?)\s*kg\s*[×x]\s*(\d+(?:[,.]\d+)?)\s*€\/kg\s*=\s*(\d+(?:[,.]\d+)?)\s*€/i);return m?{name:m[1].trim(),kg:num(m[2]),price:num(m[3]),total:num(m[4])}:null}).filter(Boolean)}
function analyze(){const t=$('#msg').value.trim();if(!t)throw Error('Incolla prima il messaggio del Formulatore Mix.');const ingredients=parseIngredients(t);if(!ingredients.length)throw Error('Non trovo gli ingredienti con quantità e prezzi.');data={mix:pick(t,'Nome mix')||'Mix personalizzato',animal:pick(t,'Animale'),goal:pick(t,'Obiettivo'),quantity:num(pick(t,'Quantità totale')),ingredients};$('#name').value=pick(t,'Nome');$('#phone').value=pick(t,'Telefono');$('#address').value=pick(t,'Comune/Indirizzo');$('#transport').value=num(pick(t,'Trasporto stimato A/R'))||0;$('#manualDiscount').value=num(pick(t,'Sconto manuale'))||0;renderIngredients();calculate();ok('Formulazione importata e preventivo calcolato. Completa i dati del cliente se mancanti.')}
function renderIngredients(){$('#ingredientList').innerHTML='<h3>Composizione importata</h3>'+data.ingredients.map(x=>`<div><span>${x.name} · ${x.kg.toFixed(2).replace('.',',')} kg × ${x.price.toFixed(2).replace('.',',')} €/kg</span><b>${money(x.total)}</b></div>`).join('')}
function buildMessage(products,discountValue,transport,total){const name=$('#name').value.trim();const valid=Math.max(1,num($('#validDays').value)||15);return ['📄 PREVENTIVO AGROTRITURA','',name?`Cliente: ${name}`:'Cliente: da indicare',$('#address').value.trim()?`Indirizzo: ${$('#address').value.trim()}`:'', '',`Mix: ${data.mix}`,data.animal?`Animale: ${data.animal}`:'',data.goal?`Obiettivo: ${data.goal}`:'',`Quantità totale: ${data.quantity||data.ingredients.reduce((s,x)=>s+x.kg,0)} kg`,'','Composizione:',...data.ingredients.map(x=>`- ${x.name}: ${x.kg.toFixed(2).replace('.',',')} kg`),'',`Totale prodotti: ${money(products)}`,discountValue>0?`Sconto: -${money(discountValue)}`:'Sconto: 0,00 €',`Trasporto: ${money(transport)}`,`Totale finale: ${money(total)}`,'',`Preventivo valido ${valid} giorni.`].filter(Boolean).join('\n')}
function calculate(){if(!data)throw Error('Analizza prima una formulazione.');const products=data.ingredients.reduce((s,x)=>s+x.total,0);const discountPct=Math.min(100,Math.max(0,num($('#manualDiscount').value)));const discountValue=products*discountPct/100;const transport=Math.max(0,num($('#transport').value));const total=products-discountValue+transport;$('#mixName').textContent=data.mix;$('#productsTotal').textContent=money(products);$('#discountTotal').textContent=discountValue?'-'+money(discountValue):money(0);$('#transportTotal').textContent=money(transport);$('#grandTotal').textContent=money(total);$('#result').classList.remove('hidden');const text=buildMessage(products,discountValue,transport,total);$('#copy').dataset.text=text;let phone=$('#phone').value.replace(/\D/g,'');if(phone&&!phone.startsWith('39'))phone='39'+phone;$('#wa').href=phone?'https://wa.me/'+phone+'?text='+encodeURIComponent(text):'#'}
$('#analyze').onclick=()=>{try{analyze()}catch(e){err(e.message)}};$('#calculate').onclick=()=>{try{calculate();ok('Preventivo aggiornato.')}catch(e){err(e.message)}};$('#clear').onclick=()=>location.reload();$('#copy').onclick=async()=>{const t=$('#copy').dataset.text;if(!t)return err('Calcola prima il preventivo.');try{await navigator.clipboard.writeText(t);ok('Preventivo copiato.')}catch{prompt('Copia:',t)}};['name','phone','address','transport','manualDiscount','validDays'].forEach(id=>$('#'+id).addEventListener('input',()=>{if(data)calculate()}));const imported=localStorage.getItem('at_quote_import');if(imported){$('#msg').value=imported;localStorage.removeItem('at_quote_import');setTimeout(()=>{try{analyze()}catch(e){err(e.message)}},50)}})();</script></body></html>
